<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile Card</title>
  <style>
    .profile-card {
      border: 1px solid #ddd;
      padding: 16px;
    }

    .profile-card img {
      width: 96px;
      height: 96px;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <img src="avatar.png" />
    <div>
      <p class="name">Mika Sato</p>
      <p>Frontend Engineer</p>
    </div>
  </div>
</body>
</html>
