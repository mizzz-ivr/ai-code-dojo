name: debug-integration

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Capture integration output
        shell: bash
        run: |
          set +e
          pnpm test:integration > integration-output.log 2>&1
          status=$?
          echo "$status" > integration-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: integration-debug-output
          path: |
            integration-output.log
            integration-status.txt
          if-no-files-found: error
          retention-days: 1
